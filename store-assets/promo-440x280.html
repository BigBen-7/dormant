<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dormant — Promo 440×280</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 440px;
    height: 280px;
    min-width: 440px;
    min-height: 280px;
    max-width: 440px;
    max-height: 280px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* very subtle grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
  }

  /* radial fade */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 20%, #0a0a0a 100%);
    pointer-events: none;
  }

  /* purple glow behind icon */
  .glow {
    position: absolute;
    width: 200px;
    height: 200px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(124,106,247,0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 440px;
    height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .icon-wrap {
    margin-bottom: 16px;
  }

  .headline {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #e8e8e8;
    line-height: 1;
    margin-bottom: 10px;
  }

  .underline {
    width: 100%;
    height: 2px;
    background: #7c6af7;
    border-radius: 1px;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  .tagline {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #666;
    text-align: center;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="page">

  <!-- Moon + Z icon (60px) -->
  <div class="icon-wrap">
    <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="moon">
          <circle cx="42" cy="54" r="40" fill="white"/>
          <circle cx="62" cy="47" r="33" fill="black"/>
        </mask>
      </defs>
      <circle cx="42" cy="54" r="40" fill="#7c6af7" mask="url(#moon)"/>
      <text x="65" y="37" font-family="'JetBrains Mono', monospace"
            font-size="26" font-weight="700" fill="#7c6af7">z</text>
    </svg>
  </div>

  <h1 class="headline">DORMANT</h1>
  <div class="underline"></div>
  <p class="tagline">Save RAM. Suspend inactive tabs.</p>

</div>
</body>
</html>
